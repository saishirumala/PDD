name: Android Appium E2E & GitHub Pages Report Deployment

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  appium-e2e-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Install Appium & UiAutomator2 Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mobile_tests/requirements.txt

      - name: Run Appium Test Suite & Report Generator
        run: |
          # Start Appium server in background
          appium --log-level info > appium.log 2>&1 &
          sleep 5

          # Execute Pytest suite
          pytest mobile_tests/test_appium_e2e.py || true

          # Generate Excel, HTML, and Markdown reports
          python mobile_tests/generate_reports.py

      - name: Upload Test Results Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Appium-Test-Results
          path: |
            Test Results/Excel/Automation_Test_Report.xlsx
            Test Results/HTML/execution-report.html
            Test Results/Screenshots/
            Test Results/Logs/
            Test Results/Summary/summary.md

      - name: Deploy Reports to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
          keep_files: true

      - name: Publish GitHub Step Summary
        if: always()
        run: |
          if [ -f reports/latest/summary.md ]; then
            cat reports/latest/summary.md >> $GITHUB_STEP_SUMMARY
          fi
